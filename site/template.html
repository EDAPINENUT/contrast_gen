<!DOCTYPE html>

{{highlighting_css}}
  </style>

  <script>
    window.MathJax = {
      tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]], tags: "none" },

      <div class="trigger">
        <a class="page-link" href="https://edapinenut.github.io/"><b>Home</b></a>

      <div id="post-meta" class="text-grey">Haitao Lin &middot; {{date}}</div>
      <div class="social-media">
        <a href="https://edapinenut.github.io/" class="icon-button github" title="Homepage">
          <i class="fa fa-home icon-github"></i><span></span>
        </a>
        <a href="{{repo}}" class="icon-button github" title="Code">
          <i class="fa fa-github icon-github"></i><span></span>
        </a>
        <a href="{{repo}}/blob/main/demo/contrastive_generation.ipynb" class="icon-button github" title="Notebook">

        </a>

</div>

<div class="page-content">
<div class="wrapper">

{{body}}

</div>

        </ul>
      </div>
      <div class="footer-col footer-col-2">

          <i class="ai ai-google-scholar-square icon-github"></i><span></span>
        </a>
        <a href="https://github.com/edapinenut" class="icon-button github">
          <i class="fa fa-github icon-github"></i><span></span>
        </a>
      </div>
      <div class="footer-col footer-col-3">
        <a href="https://edapinenut.github.io/">&larr; Back to the homepage</a>

<div class="back-to-top">Top</div>
<script>
  (function () {
    var btn = document.querySelector(".back-to-top");
    window.addEventListener("scroll", function () { btn.style.display = window.scrollY > 220 ? "block" : "none"; });
    btn.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
  })();
</script>
